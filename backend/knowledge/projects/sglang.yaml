    bugs:
      - id: fp4_disagg_wideep_composability
        type: bug
        title: "FP4 + Disagg + WideEP Composability Failure"
        gap: "Each optimization works individually on MI355X; composed together, DPA produces 0% accuracy and MTP truncates"
        severity: critical
        status: active
        discovered_at: "2026-03-10"
        last_verified: "2026-04-16"
        bottom_line: "Still reproducible. AMD engineer @billishyahao says the issue doesn't repro on SGLang main, but AMD's own public MI355X benchmarks are run on forked images where it does. No single upstream PR closes this — it's a composability-of-three problem (FP4 kernels × MoRI-EP × disagg orchestration) and the fork-to-main integration lag is the largest driver. Status vs last check: unchanged."
        visual:
          type: matrix
          title: "MI355X 3-node DeepSeek-R1 · GSM8K accuracy by optimization combo"
          rows:
            - {label: "FP4 disagg"}
            - {label: "FP8 disagg"}
          columns:
            - {label: "no DPA / no MTP"}
            - {label: "+ MTP", sublabel: "speculative decoding"}
            - {label: "+ DPA (EP8)", sublabel: "wideEP sweet spot", highlight: true}
          cells:
            - {row: 0, col: 0, status: "ok",     value: "94.6%", note: "FP4 disagg alone works"}
            - {row: 0, col: 1, status: "broken", value: "0.2%",  note: "MTP truncates under FP4 disagg"}
            - {row: 0, col: 2, status: "missing", note: "not tested in isolation"}
            - {row: 1, col: 0, status: "ok",     value: "94.3%", note: "FP8 disagg baseline"}
            - {row: 1, col: 1, status: "missing", note: "not tested in isolation"}
            - {row: 1, col: 2, status: "broken", value: "0.0%",  note: "DPA=EP8 → complete accuracy collapse"}
          footnote: "Each optimization works alone. Composed, the wideEP sweet-spot cell (FP8 disagg + DPA EP8) goes to 0% — the canonical AMD composability failure per InferenceX v2."
        technical_detail: |
          Tested on 3-node MI355X cluster with DeepSeek-R1 (SemiAnalysis /
          InferenceX v2 run, reported in SGLang #20404):

            - FP4 disagg WITHOUT DPA/MTP          → 94.6% GSM8K accuracy (WORKS)
            - FP8 disagg WITHOUT DPA              → 94.3% accuracy (WORKS)
            - FP4 disagg WITH MTP                 → 0.2% accuracy, 3.0% flexible (BROKEN)
            - FP8 disagg WITH DPA (EP8)           → 0.0% accuracy (COMPLETELY BROKEN)

          DPA (DP Attention) failure is isolated: same image, model,
          precision, only --enable-dp-attention and --ep-size differ. DPA is
          essential for wideEP at high batch sizes (amortizes weight loading
          across replicas), so losing it eliminates the entire wideEP sweet
          spot for AMD.

          AMD engineer @billishyahao claims the issue doesn't reproduce on
          SGLang main, but the reporter (@functionstackx, SemiAnalysis)
          points out AMD publishes benchmarks on FORKED images, not upstream
          — so a fix on main doesn't help if the forked images are what's
          actually deployed in customer clusters.

          Why it is a bug, not a feature gap: FP4 disagg and wideEP each
          work on their own. The capabilities are present; composing them
          produces wrong results — by definition a correctness bug.

          Why AMD should care: this is the composability gap called out by
          SemiAnalysis as AMD's #1 open technical issue vs NVIDIA. Solving
          it closes the "~6 months behind" characterization directly.
        sources:
          - url: https://github.com/sgl-project/sglang/issues/20404
            date: "2026-03-10"
            label: "Issue #20404 — MI355X disagg DPA 0% accuracy, MTP truncation"
          - url: https://inferencex.semianalysis.com/blog/inferencex-v2-nvidia-blackwell-vs-amd-vs-hopper
            date: "2026-03-15"
            label: "InferenceX v2 — composability identified as AMD's #1 gap"
          - url: https://github.com/SemiAnalysisAI/InferenceX/actions/runs/22972314055
            date: "2026-03-12"
            label: "InferenceX regression run confirming the matrix above"
        tracking_issue: https://github.com/sgl-project/sglang/issues/20404
        trajectory: "stable — not a single-fix issue; needs systemic composability work across FP4 kernels, MoRI-EP, and upstream-vs-fork alignment"
        updates: []

      - id: mi325x_thor2_epdp_decode_hang
        type: bug
        title: "MI325X + Thor-2 NIC: EP/DP Decode Startup Hang on MoRI Init"
        gap: "Decode server hangs silently at startup on MI325X clusters using Broadcom Thor-2 NICs when EP8/DP8 is enabled with --moe-a2a-backend mori"
        severity: high
        status: active
        discovered_at: "2026-04-03"
        last_verified: "2026-04-16"
        technical_detail: |
          Issue #22072 describes a production deployment failure on MI325X
          clusters using Broadcom Thor-2 (bnxt_re) NICs.

          Setup: DeepSeek-R1 FP8 disaggregated, 1P multiple-D,
          --moe-a2a-backend mori.
          Behavior: TP-only decode works. Enabling EP8/DP8 causes the decode
          server to hang silently at startup — no logs, no progress.

          Narrowed root cause: removing --moe-a2a-backend mori avoids the
          startup hang. So the hang occurs specifically inside MoRI a2a EP
          initialization when running on bnxt_re.

          After the workaround, new failures appear during inference:
            - Non-MTP: RDMA send queue overflow (SQ full).
            - MTP: HSA hardware exceptions.
          A later comment reports a working single-node EP8/DP config after
          reducing QP parameters and concurrency, but the root cause for the
          full intended configuration remains unresolved.

          Why it is a bug: MoE a2a + MoRI is the intended dispatch path;
          the EP/DP feature is supposed to be available. It fails on a
          supported NIC family on a supported GPU.

          Why AMD should care: Thor-2 (BXNT) is exactly one of the two NIC
          families AMD commits to supporting in its nightly images (see
          vLLM #38687 for the mirrored image-side story). A real deployment
          blocker on a real NIC family carries more roadmap urgency than a
          synthetic benchmark tuning gap.
        sources:
          - url: https://github.com/sgl-project/sglang/issues/22072
            date: "2026-04-03"
            label: "Issue #22072 — MI325X Thor-2 EP/DP decode hang"
        tracking_issue: https://github.com/sgl-project/sglang/issues/22072
        trajectory: "closing — workaround exists for a subset of configs, but the full EP/DP + MoRI path on bnxt_re is not robust yet"
        updates: []

      - id: mi350x_disagg_throughput_collapse
        type: bug
        title: "MI350X Disagg Throughput Collapse (~750 tok/s vs ~4K+ expected)"
        gap: "Disaggregated DeepSeek R1 on MI350X produces ~750 tok/s, an order of magnitude below expectation"
        severity: high
        status: active
        discovered_at: "2026-03-28"
        last_verified: "2026-04-16"
        technical_detail: |
          Issue #22278 reports that a MI350X disaggregated DeepSeek R1
          configuration delivers ~750 tok/s when the reasonable expectation
          (based on single-node and on InferenceX-comparable configs) is
          4,000+ tok/s. The debugging trail involved:
            - Multiple Docker image versions (v0.5.9 works, v0.5.10 broken).
            - Mooncake transport layer configuration.
            - Router config (circuit breaker, serialization).
            - Benchmarking tool parameters.

          Linked related issues:
            - #22279: aiter.dtypes AttributeError crash in MI350X Docker
              images (v0.5.10 MI35x image has a broken aiter module).
            - #22568: "AITER Upgrade Issues" — upgrades break things across
              versions; a nightly-detected 2-3% accuracy drop on
              Qwen3-235B-MXFP4 was traced to AITER commit 7b570738.

          Why it is a bug, not a feature gap: the feature (disagg on MI350X
          via MoRI) works in some image builds and breaks in others; the
          capability exists. The failure mode is a cross-component
          integration regression (router × AITER × MoRI × image), and it
          costs an order of magnitude in throughput — far above noise.

          Why AMD should care: if a customer lands on the wrong nightly
          image, they see ~750 tok/s on MI350X and compare that against
          NVIDIA B200 numbers. That comparison is effectively AMD's public
          image on any forum where the customer posts. Version-specific
          collapses of this magnitude damage the MI355X parity narrative
          even when the parity run on a known-good image holds.
        sources:
          - url: https://github.com/sgl-project/sglang/issues/22278
            date: "2026-03-28"
            label: "Issue #22278 — MI350X PD disagg throughput collapse"
          - url: https://github.com/sgl-project/sglang/issues/22279
            date: "2026-03-28"
            label: "Issue #22279 — aiter.dtypes AttributeError in v0.5.10 MI35x image"
          - url: https://github.com/sgl-project/sglang/issues/22568
            date: "2026-04-08"
            label: "Issue #22568 — AITER upgrade causes accuracy drops across versions"
        tracking_issue: https://github.com/sgl-project/sglang/issues/22278
        trajectory: "recurring — each AITER / image release risks regression; nightly testing in progress but cross-version integration hardening is the real fix"
        updates: []

