# Key insight from this data:
# - MoE models: AMD MI355X AHEAD on inference-weighted geomean (1.1-2.4x) due to AITER fused MoE advantage
# - Dense models: NVIDIA B300 AHEAD on equal-weight geomean (0.82-0.93x) due to higher HBM bandwidth
# - The gap direction depends on model architecture: MoE favors AMD, Dense favors NV
# - Production precision matters: FP8 is the standard for large models, INT4 for Kimi, MXFP4 for GPT-OSS
