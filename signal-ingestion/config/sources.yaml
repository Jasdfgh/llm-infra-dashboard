# Normalizer config
normalizer:
  # Body truncation (0 = no truncation) — MVP keeps full body per D2.1 ("完整 body，不截断")
  body_max_chars: 0
  comment_body_max_chars: 0

# Change detection config (see D5)
change_detection:
  body_edit_meaningful_threshold: 50   # <50 char diff = typo noise
  include_assignee_changes: false      # noise, not meaningful
