# dbhub — SQLite MCP server for signals.db
# See: https://github.com/bytebase/dbhub
#
# Provides ad-hoc read-only SQL queries for Module 4 Agent (Coordinator).
# To migrate to Postgres later, just change the dsn line (and switch
# parameter placeholders from ? to $N).
#
# Requirements: Node.js >= 24 (npm install -g @bytebase/dbhub@latest)
# If you see "Cannot use import statement outside a module", the Node
# version is too old — verify that the `command` in ~/.cursor/mcp.json
# points to a v24 node binary.
#
# Notes:
# - FTS5 shadow tables (signals_fts_config/_data/_docsize/_idx/_content)
#   will appear in search_objects. Add "ignore *_fts_* tables" to the
#   agent prompt.
# - In WAL mode with readonly=true, better-sqlite3 opens with O_RDONLY.
#   Reads may lag slightly behind the writer (sync_github.py); this does
#   not affect analysis.

[[sources]]
id = "signals"
description = "AMD/NVIDIA competitive intelligence signals (SQLite + FTS5)"
# DSN — relative path, resolves from working directory.
# All launchers (start_dbhub_server.sh, systemd unit) must cd to project root first.
# If dbhub fails with "directory does not exist", check that cwd is correct.
dsn = "sqlite:///home/yaywang/my-llm-infra-dashboard/data/signals.db"

# ============================================================================
# Built-in Tools
# ============================================================================

[[tools]]
name = "execute_sql"
source = "signals"
readonly = true
max_rows = 500

[[tools]]
name = "search_objects"
source = "signals"

# ============================================================================
# Custom Tools — D3.2 Intent-based MCP tools for Module 4 Agent
# ============================================================================

# Tool 1: search_signals — FTS5 full-text search
# query is required; for browsing without a query, use execute_sql instead.
[[tools]]
name = "search_signals"
source = "signals"
readonly = true
max_rows = 50
description = "Search the signal database using FTS5 full-text search. Returns signal summaries: signal_id, source_type, title, author, github_state, github_labels, github_comment_count, updated_at, version, tags, body_preview (first 200 chars), body_token_estimate. Query supports FTS5 syntax: AND/OR/NOT/\"phrases\". Example: query='aiter MLA' or query='ROCm AND bug'. For full details including body and comments, use get_signal_detail."
statement = """
  SELECT s.signal_id, s.source_type, s.title, s.author, s.github_state,
         s.github_labels, s.github_comment_count, s.updated_at, s.version,
         s.tags, SUBSTR(s.body, 1, 200) AS body_preview,
         s.body_token_estimate
  FROM signals s
  JOIN signals_fts f ON s.rowid = f.rowid
  WHERE signals_fts MATCH ?
  ORDER BY f.rank
  LIMIT ?
"""

[[tools.parameters]]
name = "query"
type = "string"
description = "FTS5 search query. Supports AND, OR, NOT, \"quoted phrases\", (grouping), column:qualifier, prefix*. Query goes directly to SQLite FTS5 without sanitization — invalid syntax will return an SQLite error. Use simple keyword queries for best reliability. Examples: 'aiter MLA', 'ROCm AND bug', '\"flash attention\" NOT triton'"

[[tools.parameters]]
name = "limit"
type = "integer"
description = "Maximum number of results to return (1-50)"
default = 20

# Tool 2: get_signal_detail — full signal with embedded comments as JSON
# Uses json_group_array + nested subquery to embed up to 50 comments in one call.
[[tools]]
name = "get_signal_detail"
source = "signals"
readonly = true
description = "Get complete details for a single signal, including full body text and all comments as a JSON array. Returns all signal columns plus comments_json (array of {comment_id, author, body, created_at, is_bot}). Use after search_signals to drill into a specific signal."
statement = """
  SELECT s.*,
    (SELECT json_group_array(json_object(
      'comment_id', comment_id,
      'author', author,
      'body', body,
      'created_at', created_at,
      'is_bot', is_bot
    ))
    FROM (
      SELECT comment_id, author, body, created_at, is_bot
      FROM signal_comments
      WHERE signal_id = s.signal_id
      ORDER BY created_at ASC
      LIMIT 50
    )
    ) AS comments_json
  FROM signals s
  WHERE s.signal_id = ?
"""

[[tools.parameters]]
name = "signal_id"
type = "string"
description = "Signal ID, e.g. 'github:vllm-project/vllm:issue:39303'"

# Tool 3: get_signal_changes — meaningful change history
# Only returns is_meaningful=1 changes by default.
[[tools]]
name = "get_signal_changes"
source = "signals"
readonly = true
description = "Get the change history for a signal. Returns meaningful changes: change_type, changed_at, detected_at, old_value, new_value, is_meaningful. Useful for tracking how an issue/PR evolved over time (state changes, label changes, new comments, body edits)."
statement = """
  SELECT change_type, changed_at, detected_at, old_value, new_value, is_meaningful
  FROM signal_changes
  WHERE signal_id = ?
    AND is_meaningful = 1
  ORDER BY detected_at DESC
  LIMIT ?
"""

[[tools.parameters]]
name = "signal_id"
type = "string"
description = "Signal ID to get change history for"

[[tools.parameters]]
name = "limit"
type = "integer"
description = "Maximum number of change records to return"
default = 50

# Tool 4: get_gap_signals — signals associated with a competitive gap
# Uses the signal_gap_ids auxiliary table for correct lookups.
[[tools]]
name = "get_gap_signals"
source = "signals"
readonly = true
max_rows = 50
description = "Get all signals associated with a specific competitive gap. Returns signal summaries: signal_id, source_type, title, author, github_state, github_labels, github_comment_count, updated_at, version, tags, body_preview. Use to understand the full picture of a gap across multiple issues/PRs."
statement = """
  SELECT s.signal_id, s.source_type, s.title, s.author, s.github_state,
         s.github_labels, s.github_comment_count, s.updated_at, s.version,
         s.tags, SUBSTR(s.body, 1, 200) AS body_preview
  FROM signals s
  WHERE EXISTS (SELECT 1 FROM signal_gap_ids g WHERE g.signal_id = s.signal_id AND g.gap_id = ?)
  ORDER BY s.updated_at DESC
  LIMIT ?
"""

[[tools.parameters]]
name = "gap_id"
type = "string"
description = "Gap ID to find associated signals for, e.g. 'gap_001'"

[[tools.parameters]]
name = "limit"
type = "integer"
description = "Maximum number of results to return"
default = 20
